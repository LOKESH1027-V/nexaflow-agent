[project]
name = "nexaflow-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "lokesh271003@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "faiss-cpu>=1.15.0",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.2",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.2",
